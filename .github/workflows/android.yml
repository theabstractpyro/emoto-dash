name: Android app

# Builds the Android (Capacitor) version of the dash on every push to main and publishes the
# signed APK as the "android" release:
#   https://github.com/theabstractpyro/emoto-dash/releases/latest/download/emoto-dash.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run tests
        run: npm test

      - name: Read app version
        id: version
        run: echo "name=$(node -p "require('fs').readFileSync('js/version.js','utf8').match(/'([^']+)'/)[1]")" >> "$GITHUB_OUTPUT"

      - name: Create the Capacitor Android project
        working-directory: android-app
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          node prepare-www.mjs
          npx cap add android
          node patch-android.mjs
          npx cap sync android

      - name: Build release APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing secrets are missing. Run emoto-dash-signing/set-github-secrets.sh once (see README)."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$BT/zipalign" -p -f 4 android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out emoto-dash.apk "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/release.p12"
          "$BT/apksigner" verify --print-certs emoto-dash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: emoto-dash-apk
          path: emoto-dash.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android emoto-dash.apk --target "$GITHUB_SHA" --latest \
            --title "eMoto Dash for Android v$VERSION" \
            --notes "Install on your phone: open this page on the phone, tap emoto-dash.apk, and allow installs from your browser if Android asks. Build ${{ github.run_number }} of commit $GITHUB_SHA."
