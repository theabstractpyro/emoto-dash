<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>eMoto Dash preview</title>
<!-- Desktop preview of the dash at phone sizes. Query: ?q=<params for the dash>, default demo mode. -->
<style>
  body { margin: 0; padding: 16px; background: #2a2d31; color: #ccc; font: 13px system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-bottom: 6px; }
  iframe { border: 0; display: block; border-radius: 18px; background: #000; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const q = new URLSearchParams(location.search).get('q') || 'demo=1&nosw=1';
  const sizes = [['Landscape 915×412', 915, 412], ['Portrait 412×915', 412, 915]];
  for (const [name, w, h] of sizes) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<figcaption>${name}</figcaption><iframe width="${w}" height="${h}" src="index.html?${q}"></iframe>`;
    document.getElementById('row').append(fig);
  }
</script>
</body>
</html>
